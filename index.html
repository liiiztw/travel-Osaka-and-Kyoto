  <script>
    const STORAGE_KEY = 'keihan_travel_plan_v5';
    let isEditMode = false;
    document.addEventListener('DOMContentLoaded', () => {
      loadSavedData();
      setupAutoSave();
    });
    function switchTab(dayId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.nav-tab').forEach(el => {
        el.classList.remove('bg-japan-red', 'text-white');
        el.classList.add('text-gray-300');
      });
      document.getElementById(dayId).classList.remove('hidden');
      const activeTab = document.getElementById('tab-' + dayId);
      if (activeTab) {
        activeTab.classList.add('bg-japan-red', 'text-white');
        activeTab.classList.remove('text-gray-300');
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    function toggleEditMode() {
      isEditMode = !isEditMode;
      const body = document.body;
      const btnText = document.getElementById('editBtnText');
      const banner = document.getElementById('editModeBanner');
      if (isEditMode) {
        body.classList.add('is-editing');
        btnText.innerText = '完成編輯';
        banner.classList.remove('hidden');
        document.querySelectorAll('.editable-area').forEach(el => {
          el.setAttribute('contenteditable', 'true');
        });
      } else {
        body.classList.remove('is-editing');
        btnText.innerText = '編輯內容';
        banner.classList.add('hidden');
        document.querySelectorAll('.editable-area').forEach(el => {
          el.setAttribute('contenteditable', 'false');
        });
        saveData();
      }
    }
    function setupAutoSave() {
      const appContent = document.getElementById('appContent');
      let timeout = null;
      appContent.addEventListener('input', () => {
        if (!isEditMode) return;
        clearTimeout(timeout);
        timeout = setTimeout(() => {
          saveData();
        }, 1000);
      });
    }
    function saveData() {
      const appContent = document.getElementById('appContent').innerHTML;
      localStorage.setItem(STORAGE_KEY, appContent);
      showToast();
    }
    function loadSavedData() {
      const savedData = localStorage.getItem(STORAGE_KEY);
      if (savedData) {
        document.getElementById('appContent').innerHTML = savedData;
      }
    }
    function showResetModal() {
      document.getElementById('resetModal').classList.remove('hidden');
    }
    function closeResetModal() {
      document.getElementById('resetModal').classList.add('hidden');
    }
    function confirmResetData() {
      localStorage.removeItem(STORAGE_KEY);
      location.reload();
    }
    function showToast() {
      const toast = document.getElementById('saveToast');
      toast.classList.remove('opacity-0', 'pointer-events-none');
      setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2000);
    }
  <\/script>
